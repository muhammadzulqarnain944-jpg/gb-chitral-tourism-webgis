<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GB & Chitral Tourist & Visitor Points - WebGIS</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="header-top">
                    <h2>🏔️ GB & Chitral Tourism</h2>
                    <span class="live-pill">LIVE WEBGIS</span>
                </div>
                <p>Explore Peaks, Lakes, Forts & Real-Time Risk Status</p>
            </div>

            <!-- Search and Filter Controls -->
            <div class="filter-section">
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="🔍 Search spots, valleys, lakes..." />
                </div>
                <div class="filter-group">
                    <select id="district-filter">
                        <option value="">All Districts</option>
                    </select>
                    <select id="category-filter">
                        <option value="">All Categories</option>
                    </select>
                </div>
                <div class="results-bar">
                    <span id="results-count">Loading destinations...</span>
                    <button id="reset-filters" class="reset-btn" style="display: none;">Reset</button>
                </div>
            </div>

            <!-- Dynamic Locations List -->
            <div id="locations-list" class="locations-list">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>Fetching spatial data from PostGIS...</p>
                </div>
            </div>
        </aside>

        <!-- Map Container -->
        <main id="map"></main>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Custom Application JS -->
    <script src="app.js"></script>
</body>

</html>
